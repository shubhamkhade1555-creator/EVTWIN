<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVTWIN Vertical Slice UI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .dashboard-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            color: #888;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .temperature {
            font-size: 48px;
            font-weight: bold;
            margin: 15px 0;
            color: #4ade80;
        }
        .status-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .dot {
            height: 10px;
            width: 10px;
            background-color: #4ade80;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 8px #4ade80;
        }
        .timestamp {
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
        }
        .metadata {
            background-color: #2a2a2a;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #aaa;
            font-family: monospace;
        }
        .metadata-row {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
        }
        .value {
            color: #fff;
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <h2>Battery Temperature</h2>
    
    <div class="temperature" id="temp-display">-- °C</div>
    
    <div class="status-row">
        <span class="dot"></span>
        <span id="connection-status">LIVE</span>
    </div>
    
    <div class="timestamp" id="time-display">Waiting for telemetry...</div>
    
    <div class="metadata">
        <div class="metadata-row">
            <span>Source:</span>
            <span class="value" id="source-display">--</span>
        </div>
        <div class="metadata-row">
            <span>Quality:</span>
            <span class="value" id="quality-display">--</span>
        </div>
        <div class="metadata-row">
            <span>Device ID:</span>
            <span class="value" id="device-display">--</span>
        </div>
    </div>
</div>

<script>
    async function fetchTelemetry() {
        try {
            const response = await fetch('http://127.0.0.1:8001/api/v1/vehicles/EV001/telemetry/latest');
            if (response.ok) {
                const data = await response.json();
                
                // Update UI based on Step 19 rules
                document.getElementById('temp-display').innerText = data.battery.temperature + ' °C';
                
                // Calculate time difference
                const updatedTime = new Date(data.timestamp);
                const now = new Date();
                const diffSeconds = Math.round((now - updatedTime) / 1000);
                document.getElementById('time-display').innerText = `Updated ${diffSeconds} seconds ago`;
                
                document.getElementById('source-display').innerText = data.source;
                document.getElementById('quality-display').innerText = data.quality;
                document.getElementById('device-display').innerText = data.deviceId;
                
                document.getElementById('connection-status').innerText = 'LIVE';
                document.querySelector('.dot').style.backgroundColor = '#4ade80';
                document.querySelector('.dot').style.boxShadow = '0 0 8px #4ade80';
            }
        } catch (error) {
            console.error('Error fetching telemetry:', error);
            document.getElementById('connection-status').innerText = 'OFFLINE';
            document.querySelector('.dot').style.backgroundColor = '#ef4444';
            document.querySelector('.dot').style.boxShadow = '0 0 8px #ef4444';
        }
    }

    // Poll API every 2 seconds
    setInterval(fetchTelemetry, 2000);
    fetchTelemetry(); // Initial fetch
</script>

</body>
</html>
